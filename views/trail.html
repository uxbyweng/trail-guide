{% extends "base.html" %}

{% block title %}{{ region.title }} · Trail-Guide{% endblock %}

{% block main_content %}
<main class="container">

    <nav aria-label="breadcrumb">
        <ul>
            <li><a href="/">Regions</a></li>
            <li>{{ region.name }}</li>
        </ul>
    </nav>

    <article class="trail-detail">

        <header class="trail-header">
            <span class="eyebrow">{{ region.country }}</span>
            <h1>{{ region.name }}</h1>
        </header>

        <<div class="trail-map">
            <iframe
                src="https://maps.google.com/maps?q={{ (trail.title ~ ', ' ~ trail.region_name ~ ', ' ~ trail.region_country) | urlencode }}&amp;output=embed&amp;hl=en"
                title="Map of {{ trail.title }}" loading="lazy" allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <section class="trail-about">
                <h2>About this region</h2>
                {{ region.description | }}
            </section>

    </article>

</main>
{% endblock main_content %}
