<!--main_content-->

{% extends "base.html" %}

{% block main_content %}
{% from "macros/trailCard.html" import trailCard %}
<main class="container-fluid">
    <section class="hero">
        <span class="eyebrow">
            Admin Area
        </span>
        <h1>
            Create and organize your Trails.
        </h1>
        <p>
            Create, organize, edit and delete all your trails in the app.
        </p>
    </section>
    <div class="grid">
        {% for t in trails %}
        {{ trailCard(t, true) }}
        {% endfor %}
    </div>
</main>
{% endblock main_content %}
