<!--main_content-->

{% extends "base.html" %}

{% block main_content %}
{% from "macros/trailCard.html" import trailCard %}
<main class="container-fluid">
    <section class="hero">
        <span class="eyebrow">
            Admin Area
        </span>
        <h1>
            Create and organize your Trails.
        </h1>
        <p>
            Create, organize, edit and delete all your trails in the app.
        </p>
    </section>

    <!-- Schwebender "Add trail"-Button (unten rechts, nur im Admin-Bereich) -->
    <a class="fab-add" href="/admin/trails/new" aria-label="Add trail" title="Add trail">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none" />
        </svg>
    </a>
    <div class="grid">
        {% for t in trails %}
        {{ trailCard(t, true) }}
        {% endfor %}
    </div>
</main>
{% endblock main_content %}
