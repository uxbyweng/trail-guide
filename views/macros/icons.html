{#
  Inline SVG icons (Lucide, ISC license). They inherit the text colour through
  currentColor, so no icon font or extra request is needed.
  Usage: {% from "macros/icons.html" import icon %} {{ icon("route") }}
#}
{% macro icon(name, size=20) %}
<svg class="icon" xmlns="http://www.w3.org/2000/svg" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true" focusable="false">
    {% if name == "route" %}
    <circle cx="6" cy="19" r="3" />
    <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
    <circle cx="18" cy="5" r="3" />
    {% elif name == "mountain" %}
    <path d="m8 3 4 8 5-5 5 15H2L8 3z" />
    {% elif name == "map-pin" %}
    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
    <circle cx="12" cy="10" r="3" />
    {% elif name == "calendar" %}
    <rect width="18" height="18" x="3" y="4" rx="2" />
    <path d="M16 2v4" />
    <path d="M8 2v4" />
    <path d="M3 10h18" />
    {% endif %}
</svg>
{% endmacro %}
